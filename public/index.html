<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysium Archive | Web Dashboard</title>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; margin-top: 0; }
        
        /* Tombol Kontrol Hemat Kuota */
        .controls { text-align: center; margin: 20px 0; }
        .btn-toggle { background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: monospace; font-weight: bold; transition: 0.2s; }
        .btn-toggle:hover { background: #38bdf8; color: #0b0f19; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 25px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card img, .card video { width: 100%; height: 230px; object-fit: cover; border-radius: 6px; cursor: pointer; }
        .name { margin-top: 8px; font-weight: bold; font-size: 13px; color: #f1f5f9; }
        .series { font-size: 11px; color: #38bdf8; margin-top: 3px; }
    </style>
</head>
<body>
    <h1>🏛️ ELYSIUM ARCHIVE 🏛️</h1>
    <p class="subtitle">Direktori Database Entitas Multidimensi</p>

    <div class="controls">
        <button class="btn-toggle" id="toggleAutoplay" onclick="toggleAutoplayMode()">Mode Video: Klik untuk Putar (Hemat Kuota)</button>
    </div>
    
    <div class="grid" id="card-grid">
        <p style="text-align: center; grid-column: 1 / -1; color: #94a3b8;">Memuat data dari terminal arsip...</p>
    </div>

    <script>
        let isAutoplayActive = false;

        function toggleAutoplayMode() {
            isAutoplayActive = !isAutoplayActive;
            const btn = document.getElementById('toggleAutoplay');
            const videos = document.querySelectorAll('video');

            if (isAutoplayActive) {
                btn.textContent = "Mode Video: Autoplay Nyala (Boros Kuota)";
                btn.style.borderColor = "#f87171";
                btn.style.color = "#f87171";
                videos.forEach(v => { v.autoplay = true; v.play(); });
            } else {
                btn.textContent = "Mode Video: Klik untuk Putar (Hemat Kuota)";
                btn.style.borderColor = "#38bdf8";
                btn.style.color = "#38bdf8";
                videos.forEach(v => { v.autoplay = false; v.pause(); });
            }
        }

        fetch('/api/cards')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('card-grid');
                if (!data.length) {
                    grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">Tidak ada entitas ditemukan.</p>';
                    return;
                }
                grid.innerHTML = data.map(c => `
                    <div class="card">
                        ${c.isVideo 
                            ? `<video src="${c.image}" muted loop playsinline preload="none" onclick="this.paused ? this.play() : this.pause()" title="Klik untuk memutar/menjeda"></video>` 
                            : `<img src="${c.image}" alt="${c.name}">`}
                        <div class="name">${c.name}</div>
                        <div class="series">${c.series}</div>
                    </div>
                `).join('');
            })
            .catch(err => {
                document.getElementById('card-grid').innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: #f87171;">Gagal memuat arsip dari server.</p>';
            });
    </script>
</body>
</html>
