<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Elysium Archive | Dashboard</title>
    <style>
        body { 
            background-color: #030305; 
            color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* --- BACKGROUND GALAKSI CSS MURNI --- */
        .galaxy-space {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            perspective: 1000px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }

        .galaxy-space.active {
            opacity: 1;
            pointer-events: auto;
        }

        .stars-layer-1 {
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: 
                150px 200px #fff, 400px 100px #a3c2ff, 800px 300px #ffb3c6,
                200px 600px #ffe9c4, 900px 700px #00ffff, 300px 400px #fff,
                1000px 200px #a3c2ff, 500px 800px #ffb3c6, 50px 900px #fff,
                750px 150px #ffe9c4, 120px 450px #00ffff, 650px 550px #a3c2ff;
            position: absolute;
            animation: rotateGalaxy 120s linear infinite;
        }

        .stars-layer-2 {
            width: 3px;
            height: 3px;
            background: transparent;
            box-shadow: 
                300px 150px #ffb3c6, 700px 400px #fff, 150px 700px #00ffff,
                850px 200px #ffe9c4, 450px 500px #a3c2ff, 950px 850px #fff,
                250px 300px #ffb3c6, 600px 100px #a3c2ff, 100px 800px #fff;
            position: absolute;
            animation: rotateGalaxyReverse 180s linear infinite;
        }

        @keyframes rotateGalaxy {
            from { transform: rotate(0deg) scale(1); }
            to { transform: rotate(360deg) scale(1.2); }
        }

        @keyframes rotateGalaxyReverse {
            from { transform: rotate(360deg) scale(1.2); }
            to { transform: rotate(0deg) scale(1); }
        }

        /* --- KONTROL TOMBOL POWER DI TENGAH --- */
        .power-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background-color: #030305;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .power-btn {
            width: 90px;
            height: 90px;
            background: rgba(10, 10, 20, 0.8);
            border: 2px solid #00ffff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.2);
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .power-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.9), inset 0 0 25px rgba(0, 255, 255, 0.7);
        }

        .power-icon {
            width: 35px;
            height: 35px;
            border: solid 3px #00ffff;
            border-radius: 50%;
            border-top-color: transparent;
            position: relative;
            transform: rotate(45deg);
            box-shadow: 0 0 10px #00ffff;
            pointer-events: none;
        }

        .power-icon::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 13px;
            width: 3px;
            height: 18px;
            background-color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }

        .label-text {
            margin-top: 18px;
            color: #00ffff;
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            text-transform: uppercase;
            pointer-events: none;
        }

        .power-wrapper.hidden {
            opacity: 0;
            transform: scale(2.5);
            pointer-events: none;
        }

        /* --- DASHBOARD UTAMA ELYSIUM ARCHIVE --- */
        .main-dashboard {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease 0.5s;
            position: relative;
            z-index: 10;
            background-color: #0b0f19;
            min-height: 100vh;
        }

        .main-dashboard.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Header & Kontrol Sticky di Atas */
        .sticky-container {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: #0b0f19;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        /* Header dengan Tombol Garis Tiga (Hamburger Menu) */
        .header { 
            background: linear-gradient(180deg, #1e293b 0%, #0b0f19 100%); 
            border-bottom: 1px solid #1e293b; 
            padding: 14px 16px; 
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Tombol Garis Tiga Estetik */
        .menu-btn {
            background: #162032;
            border: 1px solid #334155;
            border-radius: 12px;
            width: 42px;
            height: 42px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-btn:active {
            transform: scale(0.95);
            border-color: #38bdf8;
        }

        .menu-btn span {
            display: block;
            width: 18px;
            height: 2px;
            background-color: #38bdf8;
            border-radius: 2px;
        }

        .header-text h1 { 
            color: #38bdf8; 
            font-size: 16px; 
            margin: 0; 
            letter-spacing: 1px; 
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); 
        }
        .header-text p.subtitle { 
            color: #94a3b8; 
            font-size: 9px; 
            margin-top: 2px; 
            letter-spacing: 0.5px; 
            text-transform: uppercase; 
        }

        /* --- SIDEBAR / MENU NAVIGASI SAMPING --- */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 5, 0.7);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background: #0f172a;
            border-right: 1px solid #1e293b;
            z-index: 210;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .sidebar-title {
            color: #38bdf8;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .close-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-item {
            background: #162032;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 12px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .menu-item:hover {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        /* Panel Kontrol */
        .controls { text-align: center; padding: 10px 0; background: #0b0f19; }
        .btn-toggle { background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: monospace; font-weight: bold; font-size: 11px; transition: 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .btn-toggle:hover { background: #38bdf8; color: #0b0f19; }

        .container { max-width: 1200px; margin: 0 auto; padding: 12px; }

        /* Grid 2 Kolom */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        
        /* Desain Kartu Gaya Profil Modern dengan Scroll Fade-In Berulang */
        .card { 
            background: linear-gradient(145deg, #162032 0%, #0f172a 100%); 
            border: 1px solid #334155; 
            border-radius: 14px; 
            padding: 10px; 
            text-align: center; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.4); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card.scroll-animate {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .card.scroll-animate.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .card img, .card video { 
            width: 100%; 
            height: 140px; 
            object-fit: cover; 
            border-radius: 10px; 
            cursor: pointer; 
            background: #0b0f19; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .card-content {
            padding: 8px 4px 4px 4px;
        }

        .name { 
            font-weight: bold; 
            font-size: 14px; 
            color: #f8fafc; 
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        
        .series { 
            font-size: 10px; 
            color: #94a3b8; 
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .badge-rarity {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- GERBANG TOMBOL POWER & GALAKSI -->
    <div class="power-wrapper" id="powerWrapper">
        <div class="power-btn" id="powerBtn">
            <div class="power-icon"></div>
        </div>
        <div class="label-text">SYSTEM OFFLINE</div>
    </div>

    <!-- BACKGROUND GALAKSI MURNI CSS -->
    <div class="galaxy-space" id="galaxySpace">
        <div class="stars-layer-1"></div>
        <div class="stars-layer-2"></div>
    </div>

    <!-- SIDEBAR NAVIGATION MENU -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">NAVIGATION</div>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="sidebar-menu">
            <a href="#" class="sidebar-item menu-item"><span>Database Cards</span> ➔</a>
            <a href="#" class="sidebar-item menu-item"><span>API Documentation</span> ➔</a>
            <a href="#" class="sidebar-item menu-item"><span>System Metrics</span> ➔</a>
        </div>
    </div>

    <!-- DASHBOARD UTAMA ELYSIUM ARCHIVE -->
    <div class="main-dashboard" id="mainDashboard">
        <div class="sticky-container">
            <div class="header">
                <!-- Tombol Garis Tiga -->
                <button class="menu-btn" onclick="toggleSidebar()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="header-text">
                    <h1>ELYSIUM ARCHIVE</h1>
                    <p class="subtitle">Direktori Database Entitas Multidimensi</p>
                </div>
            </div>
            <div class="controls">
                <button class="btn-toggle" id="toggleAutoplay" onclick="toggleAutoplayMode()">Mode Video: Klik untuk Putar</button>
            </div>
        </div>

        <div class="container">
            <div class="grid" id="card-grid">
                <p style="text-align: center; grid-column: 1 / -1; color: #94a3b8; font-size: 12px;">Memuat data dari terminal arsip...</p>
            </div>
        </div>
    </div>

    <script>
        const powerBtn = document.getElementById('powerBtn');
        const powerWrapper = document.getElementById('powerWrapper');
        const galaxySpace = document.getElementById('galaxySpace');
        const mainDashboard = document.getElementById('mainDashboard');

        powerBtn.addEventListener('click', () => {
            powerWrapper.classList.add('hidden');
            galaxySpace.classList.add('active');
            
            setTimeout(() => {
                mainDashboard.classList.add('show');
            }, 600);
        });

        // Fungsi Buka-Tutup Sidebar Menu
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        let isAutoplayActive = false;

        function toggleAutoplayMode() {
            isAutoplayActive = !isAutoplayActive;
            const btn = document.getElementById('toggleAutoplay');
            const videos = document.querySelectorAll('video');

            if (isAutoplayActive) {
                btn.textContent = "Mode Video: Autoplay Nyala";
                btn.style.borderColor = "#f87171";
                btn.style.color = "#f87171";
                videos.forEach(v => { v.autoplay = true; v.play(); });
            } else {
                btn.textContent = "Mode Video: Klik untuk Putar";
                btn.style.borderColor = "#38bdf8";
                btn.style.color = "#38bdf8";
                videos.forEach(v => { v.autoplay = false; v.pause(); });
            }
        }

        fetch('/api/cards')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('card-grid');
                if (!data.length) {
                    grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; font-size: 12px;">Tidak ada entitas ditemukan.</p>';
                    return;
                }
                
                grid.innerHTML = data.map((c) => `
                    <div class="card scroll-animate">
                        ${c.isVideo 
                            ? `<video src="${c.image}" muted loop playsinline preload="metadata" onclick="this.paused ? this.play() : this.pause()" title="Klik untuk memutar/menjeda"></video>` 
                            : `<img src="${c.image}" alt="${c.name}">`}
                        <div class="card-content">
                            <div class="name">${c.name}</div>
                            <div class="series">Asal Seri: ${c.series}</div>
                            <span class="badge-rarity">Entity Database</span>
                        </div>
                    </div>
                `).join('');

                const observerOptions = {
                    root: null,
                    rootMargin: '0px',
                    threshold: 0.1
                };

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('show');
                        } else {
                            entry.target.classList.remove('show');
                        }
                    });
                }, observerOptions);

                document.querySelectorAll('.scroll-animate').forEach(card => {
                    observer.observe(card);
                });
            })
            .catch(err => {
                document.getElementById('card-grid').innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: #f87171; font-size: 12px;">Gagal memuat arsip.</p>';
            });
    </script>
</body>
</html>
